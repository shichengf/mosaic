#########################################
# BetaVAE follow-up on Synthetic (monotonic)  #
# z_dim=8, β=4, 80 epochs, no aux, no temporal
#########################################

ROOT: 'data'
LOG: 'experiments/synth_crl_baselines'
DATASET: 'synthetic_well_v2'

NS: TRUE
MODEL: 'BetaVAE'

VAE:
    GPU: [0]
    CPU: 4
    TRAIN_BS: 64
    VAL_BS: 256
    EPOCHS: 80
    N_VAL_SAMPLES: 2048
    INPUT_DIM: 30
    LATENT_DIM: 8
    ENC:
        HIDDEN_DIM: 128
    DEC:
        HIDDEN_DIM: 128
    PIN: TRUE

BetaVAE:
    BETA: 4
    GAMMA: 0
    RATE_PRIOR: 1
    beta1_VAE: 0.9
    beta2_VAE: 0.999
    LR: 1.0e-4

SlowVAE:
    beta1_VAE: 0.9
    beta2_VAE: 0.999

MCC:
    FREQ: 0.1
    CORR: 'Pearson'
