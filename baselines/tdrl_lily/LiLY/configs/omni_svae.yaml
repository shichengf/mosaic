#########################
# SlowVAE on omni
#########################

ROOT: 'data/omni'
LOG: 'baseline/results/svae_omni'
DATASET: 'prepared'

NS: TRUE
MODEL: 'SlowVAE'

VAE:
    GPU: [0]
    CPU: 4
    TRAIN_BS: 128
    VAL_BS: 256
    EPOCHS: 100
    N_VAL_SAMPLES: 2048
    INPUT_DIM: 21
    LATENT_DIM: 4
    ENC:
        HIDDEN_DIM: 128
    DEC:
        HIDDEN_DIM: 128
    PIN: TRUE

SlowVAE:
    BETA: 1
    GAMMA: 10
    RATE_PRIOR: 6
    beta1_VAE: 0.9
    beta2_VAE: 0.999
    LR: 1.0e-4

MCC:
    FREQ: 0.1
    CORR: 'Pearson'
